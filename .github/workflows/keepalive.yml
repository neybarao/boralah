name: Manter Supabase acordado

# O plano grátis do Supabase pausa projetos com pouca atividade em 7 dias.
# Esta tarefa faz uma leitura simples no banco a cada 3 dias.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no banco
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Segredos do Supabase ainda não configurados. Nada a fazer."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/places?select=id&limit=1"
