<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Sempre em HTTPS. Aberto por http://, o iPhone instala o app como "site não seguro":
      // aparece a barra do Safari, o service worker não roda (sem atualização automática)
      // e a foto não vai por trás da status bar.
      if (location.protocol === 'http:' && !/^(localhost|127\.|192\.168\.)/.test(location.hostname)) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash)
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- iOS: mesmo esquema do Dia (home-org): standalone, status bar default e theme-color igual ao fundo -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Onde comer hoje, com espaço kids." />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>BoraLah</title>
    <script>
      // Aplica o tema antes da primeira pintura para não piscar branco
      ;(function () {
        var t
        try { t = localStorage.getItem('boralah-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#16120F')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
